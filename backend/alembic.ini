[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The database URL is supplied by alembic/env.py from application settings,
# so no credential or path is hardcoded here.
sqlalchemy.url =

# No post-write hooks. A console_scripts hook needs ruff installed as a Python
# package inside the project venv, which requirements.txt does not provide, so
# `alembic revision` would fail. Format new revisions with `ruff format` by hand.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
